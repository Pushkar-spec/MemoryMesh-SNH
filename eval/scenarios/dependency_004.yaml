id: dependency-004
category: dependency_propagation
description: >-
  Dependency propagation with mutual entity dependencies. Note on data model limitation:
  Supported sequential claim ingestion creates strictly acyclic memory DAGs because each
  new memory record ID is strictly greater than any pre-existing foundation target (src > dst).
  Demonstrated memory-level directed edge cycles and cycle termination are explicitly
  verified in tests/test_p83_scenarios.py::test_p83_dependency_cycle_propagation_proven.
